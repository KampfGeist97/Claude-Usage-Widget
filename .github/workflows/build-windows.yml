name: Build Electron Windows

on:
  workflow_dispatch:
  push:
    branches:
      - electron
      - electron-v3
    tags:
      - "v3*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Syntax and unit tests
        run: |
          npm run check
          npm test

      - name: Build unpacked Windows app
        run: npm run build:win

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageWidget-electron-v3-windows-x64
          path: dist/win-unpacked/**
          if-no-files-found: error
          retention-days: 30
